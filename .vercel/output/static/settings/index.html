<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x app</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"><link rel="stylesheet" href="/katex/katex.min.css"/><nav class="flex items-center gap-6 border-b border-border px-6 py-3"><a href="/" class="text-lg font-bold tracking-tight">x<span class="text-accent">type</span></a><a href="/project/new" class="text-sm text-muted-foreground transition-colors hover:text-foreground">Editor</a><a href="/settings" class="text-sm text-muted-foreground transition-colors hover:text-foreground">Settings</a></nav><main><div class="mx-auto max-w-2xl px-6 py-16"><h1 class="text-3xl font-bold">Settings</h1><p class="mt-4 text-muted-foreground">Editor preferences and data management will live here. GitHub sync is planned for a future release.</p><div class="mt-8 rounded-xl border border-border bg-card p-6 text-sm text-muted-foreground">Nothing to configure yet — see <a class="text-accent underline" href="https://github.com/abdelkabirouadoukou/xtype/issues">the issue tracker</a> for what is coming.</div></div></main></div>
        
    <script>(function () {
  if (window.__xNav) return;
  window.__xNav = true;

  var cache = new Map();

  document.addEventListener("click", function (ev) {
    if (ev.defaultPrevented || ev.button !== 0) return;
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    var anchor = resolveLink(ev.target && ev.target.closest ? ev.target.closest("a[href]") : null);
    if (!anchor) return;
    ev.preventDefault();
    if (anchor.href !== location.href) navigate(anchor, true);
  });

  document.addEventListener(
    "mouseover",
    function (ev) {
      var anchor = resolveLink(ev.target && ev.target.closest ? ev.target.closest("a[href]") : null);
      if (!anchor || anchor.hasAttribute("data-no-prefetch")) return;
      prefetch(anchor);
    },
    { passive: true },
  );

  document.addEventListener(
    "focusin",
    function (ev) {
      var anchor = resolveLink(ev.target && ev.target.closest ? ev.target.closest("a[href]") : null);
      if (!anchor || anchor.hasAttribute("data-no-prefetch")) return;
      prefetch(anchor);
    },
    { passive: true },
  );

  window.addEventListener("popstate", function () {
    navigate(new URL(location.href), false);
  });

  var style = document.createElement("style");
  style.textContent = [
    ".x-nav-loading{cursor:progress}",
    ".x-nav-loading::after{content:'';position:fixed;top:0;left:0;height:2px;width:100%;",
    "background:var(--x-accent,#6ab0ff);z-index:9999;animation:x-nav-progress .8s ease-in-out infinite}",
    "@keyframes x-nav-progress{0%{transform:translateX(-100%)}50%{transform:translateX(0)}100%{transform:translateX(100%)}}",
  ].join("");
  document.head.appendChild(style);

  function resolveLink(anchor) {
    if (!anchor) return null;
    if (anchor.hasAttribute("data-no-nav")) return null;
    if (anchor.target && anchor.target !== "_self") return null;
    if (anchor.hasAttribute("download")) return null;
    var href = anchor.getAttribute("href");
    if (!href) return null;
    if (/^(#|mailto:|tel:|javascript:)/i.test(href)) return null;
    var url;
    try {
      url = new URL(href, location.href);
    } catch (_) {
      return null;
    }
    if (url.origin !== location.origin) return null;
    var here = new URL(location.href);
    if (url.pathname === here.pathname && url.search === here.search && url.hash) return null;
    return anchor;
  }

  function setLoading(on) {
    document.documentElement.classList.toggle("x-nav-loading", on);
  }

  function prefetch(url) {
    if (cache.has(url.href)) return cache.get(url.href);
    var promise = fetch(url.href, { headers: { "X-X-Nav": "1" } })
      .then(function (res) {
        return res.text().then(function (html) {
          var ct = res.headers.get("content-type") || "";
          return { html: html, ok: res.ok, finalUrl: res.url || url.href, isHtml: ct.indexOf("text/html") !== -1 };
        });
      })
      .catch(function (err) {
        cache.delete(url.href);
        throw err;
      });
    if (cache.size >= 30) {
      var first = cache.keys().next().value;
      if (first !== undefined) cache.delete(first);
    }
    cache.set(url.href, promise);
    return promise;
  }

  function navigate(url, push) {
    setLoading(true);
    prefetch(url)
      .then(function (payload) {
        if (!payload.isHtml) {
          location.href = url.href;
          return;
        }
        var doc = new DOMParser().parseFromString(payload.html, "text/html");
        var next = doc.getElementById("root");
        var root = document.getElementById("root");
        if (!next || !root) {
          location.href = url.href;
          return;
        }
        if (push) history.pushState({ xNav: true }, "", payload.finalUrl);
        if (doc.title) document.title = doc.title;
        root.innerHTML = next.innerHTML;
        reexecuteScripts(root);
        if (url.hash) {
          var target = document.getElementById(url.hash.slice(1));
          if (target) {
            target.scrollIntoView();
            return;
          }
        }
        window.scrollTo(0, 0);
      })
      .catch(function () {
        location.href = url.href;
      })
      .finally(function () {
        setLoading(false);
      });
  }

  function reexecuteScripts(root) {
    var scripts = root.querySelectorAll("script");
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i];
      var el = document.createElement("script");
      for (var j = 0; j < old.attributes.length; j++) {
        var attr = old.attributes[j];
        el.setAttribute(attr.name, attr.value);
      }
      el.textContent = old.textContent;
      old.replaceWith(el);
    }
  }

  /** Soft reload current page without a full document reload (used by dev live-reload). */
  window.__xSoftReload = function () {
    navigate(new URL(location.href), false);
  };
})();</script>
  </body>
</html>
